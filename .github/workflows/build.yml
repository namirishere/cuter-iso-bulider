name: Build Custom Arch ISO

on:
  workflow_dispatch:
    inputs:
      kernel:
        description: 'Choose Linux Kernel'
        required: true
        default: 'linux'
        type: choice
        options:
          - linux
          - linux-lts
          - linux-zen
          - linux-hardened
      desktop:
        description: 'Choose Desktop (gnome, kde-plasma, xfce, mate, cinnamon, lxde, lxqt, budgie, pantheon, i3, sway, fluxbox, openbox)'
        required: true
        default: 'mate'
        type: string
      browser:
        description: 'Choose Browser (firefox, chromium, falkon, dillo)'
        required: true
        default: 'firefox'
        type: string
      extra_apps:
        description: 'Other tools (space-separated, e.g., thunderbird vlc mpv strawberry gparted flatpak conky virtualbox fastfetch htop)'
        required: false
        type: string
        default: 'thunderbird vlc mpv strawberry gparted flatpak conky virtualbox fastfetch htop'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Initialize code infrastructure
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Use a managed, pre-built ArchISO Action to handle the heavy lifting safely
      - name: Build Arch Linux ISO Action
        uses: antoniosantiagour/archiso-action@v2
        with:
          # Automatically uses the official upstream baseline template configuration
          template: 'releng' 
          # Safely injects the kernel, desktop packages, browser, and all utilities together
          packages: |
            ${{ inputs.kernel }}
            ${{ inputs.desktop }}
            ${{ inputs.browser }}
            ${{ inputs.extra_apps }}
            xorg-server
            lightdm
            lightdm-gtk-greeter

      # Step 3: Publish the completed bootable file
      - name: Upload Finished ISO Image
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Arch-ISO
          path: |
            *.iso
            out/*.iso
