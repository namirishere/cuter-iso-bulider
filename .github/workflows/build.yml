name: Build Custom Arch ISO

on:
  workflow_dispatch:
    inputs:
      kernel:
        description: 'Choose Linux Kernel'
        required: true
        default: 'linux'
        type: choice
        options:
          - linux
          - linux-lts
          - linux-zen
          - linux-hardened
      desktop:
        description: 'Choose Desktop Environment / Window Manager'
        required: true
        default: 'mate'
        type: choice
        options:
          - none
          - gnome
          - kde-plasma
          - xfce
          - i3
          - sway
          - cosmic
          - mate
          - cinnamon
          - lxde
          - lxqt
          - budgie
          - pantheon
          - fluxbox
          - openbox
      browser:
        description: 'Choose Web Browser'
        required: true
        default: 'firefox'
        type: choice
        options:
          - none
          - firefox
          - chromium
          - falkon
          - dillo
      mail:
        description: 'Choose Mail Client'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - thunderbird
      media_player:
        description: 'Choose Media Player'
        required: true
        default: 'vlc'
        type: choice
        options:
          - none
          - vlc
          - mpv
          - strawberry
      office:
        description: 'Choose Office Suite'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - libreoffice-fresh
          - libreoffice-still
      dock:
        description: 'Choose Desktop Dock'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - plank
          - cairo-dock
      include_utilities:
        description: 'Install Utilities (GParted, Flatpak, Conky, VirtualBox)?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      include_cli_tools:
        description: 'Install Core CLI Tools (fastfetch, htop)?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      extra_apps:
        description: 'Extra apps space-separated'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Parse User Inputs to Build Configuration
        run: |
          # Create a clean text bundle for all user choices
          echo "Injecting selections safely..."
          
          # Initialize package build list configuration
          echo "" > user_packages.txt
          
          # Add individual package configurations safely
          echo "${{ inputs.kernel }}" >> user_packages.txt
          
          # Handle desktop matching definitions cleanly
          case "${{ inputs.desktop }}" in
            gnome) echo -e "gnome\ngnome-extra\ngdm" >> user_packages.txt ;;
            kde-plasma) echo -e "plasma-desktop\nsddm\nkonsole\ndolphin" >> user_packages.txt ;;
            xfce) echo -e "xfce4\nxfce4-goodies\nlightdm\nlightdm-gtk-greeter" >> user_packages.txt ;;
            i3) echo -e "i3-wm\ni3status\ndmenu\nxorg-server\nxterm\nlightdm\nlightdm-gtk-greeter" >> user_packages.txt ;;
            sway) echo -e "sway\nswaylock\nswayidle\nwaybar\nalacritty\ndmenu" >> user_packages.txt ;;
            cosmic) echo -e "cosmic-session\ncosmic-greeter" >> user_packages.txt ;;
            mate) echo -e "mate\nmate-extra\nxorg-server\nlightdm\nlightdm-gtk-greeter" >> user_packages.txt ;;
            cinnamon) echo -e "cinnamon\nxorg-server\nlightdm\nlightdm-gtk-greeter" >> user_packages.txt ;;
            lxde) echo -e "lxde\nxorg-server\nlxdm" >> user_packages.txt ;;
            lxqt) echo -e "lxqt\nsddm\nxorg-server" >> user_packages.txt ;;
            budgie) echo -e "budgie\nbudgie-backgrounds\nxorg-server\nlightdm\nlightdm-gtk-greeter" >> user_packages.txt ;;
            pantheon) echo -e "pantheon\nxorg-server\nlightdm\npantheon-greeter" >> user_packages.txt ;;
            fluxbox) echo -e "fluxbox\nxorg-server\nxterm\nlightdm\nlightdm-gtk-greeter" >> user_packages.txt ;;
            openbox) echo -e "openbox\nxorg-server\nxterm\nlightdm\nlightdm-gtk-greeter" >> user_packages.txt ;;
          esac
          
          # Add applications arrays securely if specified
          if [ "${{ inputs.browser }}" != "none" ]; then echo "${{ inputs.browser }}" >> user_packages.txt; fi
          if [ "${{ inputs.mail }}" != "none" ]; then echo "${{ inputs.mail }}" >> user_packages.txt; fi
          if [ "${{ inputs.media_player }}" != "none" ]; then echo "${{ inputs.media_player }}" >> user_packages.txt; fi
          if [ "${{ inputs.office }}" != "none" ]; then echo "${{ inputs.office }}" >> user_packages.txt; fi
          if [ "${{ inputs.dock }}" != "none" ]; then echo "${{ inputs.dock }}" >> user_packages.txt; fi
          
          if [ "${{ inputs.include_utilities }}" = "true" ]; then
            echo -e "gparted\nflatpak\nconky\nvirtualbox\nvirtualbox-host-dkms" >> user_packages.txt
          fi
          
          if [ "${{ inputs.include_cli_tools }}" = "true" ]; then
            echo -e "fastfetch\nhtop" >> user_packages.txt
          fi
          
          if [ -n "${{ inputs.extra_apps }}" ]; then
            for app in ${{ inputs.extra_apps }}; do echo "$app" >> user_packages.txt; done
          fi
          
          # Save list formatting to step variables block
          echo "USER_PACKAGES<<EOF" >> $GITHUB_ENV
          cat user_packages.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Managed Arch ISO Builder Engine
        uses: antoniosantiagour/archiso-action@v2
        with:
          template: 'releng'
          # This maps the user selections seamlessly without file path interactions
          packages: |
            ${{ env.USER_PACKAGES }}
            xorg-server
            lightdm
            lightdm-gtk-greeter

      - name: Upload Completed ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arch-Custom-ISO
          path: |
            *.iso
            out/*.iso
